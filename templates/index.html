<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pratham Prototype Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2f;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #4b6cb7;
            background-image: linear-gradient(315deg, #4b6cb7 0%, #182848 74%);
            padding: 1rem 2rem;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            letter-spacing: 1.2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        main {
            flex: 1;
            padding: 1rem 2rem;
            overflow-y: auto;
            background: #2b2c37;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            border-radius: 8px;
            background: #38394a;
            box-shadow: inset 0 0 10px #131326;
        }
        .message {
            margin-bottom: 1rem;
            max-width: 75%;
            padding: 0.7rem 1rem;
            border-radius: 10px;
            line-height: 1.4;
        }
        .user-message {
            align-self: flex-end;
            background-color: #4b6cb7;
            color: white;
            border-bottom-right-radius: 0;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #6c757d;
            color: white;
            border-bottom-left-radius: 0;
        }
        form {
            display: flex;
            background: #292a3b;
            padding: 1rem 2rem;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 0.7rem;
            border: none;
            border-radius: 10px 0 0 10px;
            font-size: 1rem;
            outline: none;
            background: #44475a;
            color: white;
        }
        button {
            background-color: #4b6cb7;
            border: none;
            padding: 0 1.2rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 0 10px 10px 0;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #36519d;
        }
        @media (max-width: 600px) {
            header {
                font-size: 1.5rem;
                padding: 1rem;
            }
            form {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>Shresh... the Future</header>
    <main>
        <div class="chat-container" id="chat-container">
            <!-- Chat messages will appear here -->
        </div>
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Enter your text here..." autocomplete="off" required />
            <button type="submit">Send</button>
        </form>
    </main>

<script>
const form = document.getElementById('chat-form');
const input = document.getElementById('user-input');
const chatContainer = document.getElementById('chat-container');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const userMessage = input.value.trim();
    if (!userMessage) return;
    
    addMessage(userMessage, 'user-message');
    input.value = '';
    chatContainer.scrollTop = chatContainer.scrollHeight;
    
    // Show temporary loading message
    addMessage("Processing your request...", 'bot-message');
    chatContainer.scrollTop = chatContainer.scrollHeight;

    // 🚀 Send request to Flask backend
    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: userMessage })
        });
        const data = await response.json();

        // Remove temporary "processing" message
        const processingMessage = document.querySelector('.bot-message:last-child');
        if (processingMessage) processingMessage.remove();

        addMessage(data.response, 'bot-message');
        chatContainer.scrollTop = chatContainer.scrollHeight;
    } catch (error) {
        console.error("Error:", error);
        addMessage("⚠️ Error connecting to the AI server.", 'bot-message');
    }
});

function addMessage(text, className) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${className}`;
    messageDiv.textContent = text;
    chatContainer.appendChild(messageDiv);
}
</script>

</body>
